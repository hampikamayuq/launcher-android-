name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verificar que a tag corresponde ao versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          echo "Tag: $TAG_VERSION — versionName: $GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::A tag v$TAG_VERSION não corresponde ao versionName ($GRADLE_VERSION) em app/build.gradle.kts."
            exit 1
          fi

      - name: Verificar secrets de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure os secrets de assinatura (veja docs/release.md)"
            exit 1
          fi

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build e assinatura da release
        env:
          CASCATA_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CASCATA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CASCATA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CASCATA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon test lint assembleRelease

      - name: Verificar assinatura do APK
        run: |
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"

      - name: Renomear APK e gerar checksum
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SRC_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"
          DEST_APK="Cascata-v${VERSION}.apk"
          cp "$SRC_APK" "$DEST_APK"
          sha256sum "$DEST_APK" > "$DEST_APK.sha256"
          echo "APK_PATH=$DEST_APK" >> "$GITHUB_ENV"
          echo "SHA_PATH=$DEST_APK.sha256" >> "$GITHUB_ENV"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
          generate_release_notes: true
