name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Verificar que a tag corresponde ao versionName
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION="$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)"
          echo "Tag: $TAG_VERSION — versionName: $GRADLE_VERSION"
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::A tag v$TAG_VERSION não corresponde ao versionName ($GRADLE_VERSION) em app/build.gradle.kts."
            exit 1
          fi

      - name: Verificar secrets de assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Configure os secrets de assinatura (veja docs/release.md)"
            exit 1
          fi

      - name: Decodificar keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build e assinatura da release
        env:
          CASCATA_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CASCATA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CASCATA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CASCATA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testLiteReleaseUnitTest testFullReleaseUnitTest lintLiteRelease lintFullRelease assembleRelease

      # Duas edições, dois APKs: a assinatura de cada um é conferida antes de
      # qualquer coisa ser publicada.
      - name: Verificar a assinatura de cada APK
        run: |
          shopt -s nullglob
          APKS=(app/build/outputs/apk/*/release/*.apk)
          if [ "${#APKS[@]}" -ne 2 ]; then
            echo "::error::Esperava 2 APKs de release (lite e full), achei ${#APKS[@]}."
            exit 1
          fi
          for APK in "${APKS[@]}"; do
            echo "::group::$APK"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK"
            echo "::endgroup::"
          done

      - name: Renomear APKs e gerar checksums
        run: |
          shopt -s nullglob
          VERSION="${GITHUB_REF_NAME#v}"
          FILES=()
          for APK in app/build/outputs/apk/*/release/*.apk; do
            # .../apk/<flavor>/release/app-<flavor>-release.apk
            FLAVOR="$(basename "$(dirname "$(dirname "$APK")")")"
            DEST="Cascata-v${VERSION}-${FLAVOR}.apk"
            cp "$APK" "$DEST"
            sha256sum "$DEST" > "$DEST.sha256"
            FILES+=("$DEST" "$DEST.sha256")
          done
          {
            echo "RELEASE_FILES<<EOF"
            printf '%s\n' "${FILES[@]}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Criar GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.RELEASE_FILES }}
          generate_release_notes: true
